name: CI

on:
  push:
  pull_request:

jobs:
  build-and-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import app
        run: python -c "import app"

      - name: Run basic evaluation scripts (optional)
        run: |
          python -m eval.latency_eval || echo "Latency eval skipped (requires API keys)"
          python -m eval.run_eval || echo "Run eval skipped (requires API keys)"
